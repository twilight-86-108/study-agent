[project]
name = "study-agent"
version = "0.1.0"
description = "AI-Powered Learning Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.21.0",
    "rich>=14.0.0",
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "chromadb>=1.4.0",
    "pymupdf>=1.26.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
gemini = ["google-generativeai>=0.8.0"]
claude = ["anthropic>=0.45.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.10.0",
    "mypy>=1.15.0",
]

[project.scripts]
study-agent = "study_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/study_agent"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
